<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversário da Manuela - Branca de Neve</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700&display=swap');

        :root {
            --azul-claro: #81d4fa; 
            --branco: #ffffff;
            --vermelho-claro: #ff7f7f;
            --amarelo: #ffeb66;
            --texto-escuro: #333333;
            --amarelo-escuro: #f5b000;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--azul-claro);
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%2301579b' fill-opacity='0.12'%3E%3Cpath d='M30,18 C25,16 20,20 20,28 C20,36 25,40 28,38 C30,39 30,39 32,38 C35,40 40,36 40,28 C40,20 35,16 30,18 Z'/%3E%3Cpath d='M75,20 L80,32 L90,22 L100,32 L105,20 L100,42 L80,42 Z'/%3E%3Cpath d='M22,78 L38,78 L44,88 L30,105 L16,88 Z'/%3E%3Cpath d='M85,75 L95,75 L102,88 L90,105 L78,88 Z'/%3E%3C/g%3E%3Cpath d='M30,18 Q30,10 35,10' fill='none' stroke='%2301579b' stroke-width='2' stroke-opacity='0.12'/%3E%3C/svg%3E");
            margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;
        }

        .container {
            background-color: var(--branco);
            border: 8px double var(--vermelho-claro);
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 40px; max-width: 600px; width: 100%; text-align: center; position: relative;
        }

        h1 { font-family: 'Dancing Script', cursive; color: var(--vermelho-claro); font-size: 3.8em; margin: 5px 0; }
        h2 { color: var(--amarelo-escuro); font-size: 1.5em; margin-bottom: 25px; text-transform: uppercase; }
        p { color: var(--texto-escuro); font-size: 1.15em; line-height: 1.6; }

        .form-group { margin: 20px 0; text-align: left; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 25px; box-sizing: border-box; font-size: 1.1em;
        }

        .radio-group { display: flex; gap: 20px; margin-top: 10px; }
        button {
            background-color: var(--vermelho-claro); color: var(--branco); border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 30px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 15px;
        }
        .btn-yellow { background-color: var(--amarelo); color: #333; }
        
        /* Estilo do botão de excluir */
        .btn-delete { 
            background-color: #ff4d4d; 
            padding: 8px 15px; 
            font-size: 0.9em; 
            margin-top: 0; 
            width: auto; 
            box-shadow: none;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: var(--azul-claro); color: white; }

        #login-page, #admin-page { display: none; }
        .admin-link { margin-top: 30px; display: block; color: #ccc; cursor: pointer; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="container" id="invite-page">
        <h1>Aniversário da Manuela</h1>
        <h2>12 Anos</h2>
        <p>Você está convidado(a) para um verdadeiro conto de fadas!<br>
        <strong>17/05/2026 | Sítio Vista Bella
            Horário: das 11:00 até 15:30
        </strong></p>
        
        <img src="img/manuimg.png" width="100%" style="border-radius: 15px; margin-bottom: 15px;">
        
        <form id="rsvp-form" onsubmit="saveGuest(event)">
            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Você irá?</label>
                <div class="radio-group">
                    <label><input type="radio" name="presence" value="Sim, eu vou!" required> Sim!</label>
                    <label><input type="radio" name="presence" value="Não poderei ir."> Não</label>
                </div>
            </div>
            <button type="submit" id="btn-enviar">Confirmar Presença</button>
        </form>
        <span class="admin-link" onclick="showPage('login-page')">✦ Acesso Restrito ✦</span>
    </div>

    <div class="container" id="login-page">
        <h1>Área da Manuela</h1>
        <input type="password" id="password" placeholder="Senha secreta">
        <button onclick="checkPassword()">Entrar</button>
        <button class="btn-yellow" onclick="showPage('invite-page')">Voltar</button>
    </div>

    <div class="container" id="admin-page">
        <h1>Lista de Convidados</h1>
        <div style="overflow-x:auto;">
            <table id="guests-table">
                <thead><tr><th>Nome</th><th>Presença</th><th>Ação</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <button class="btn-yellow" style="margin-top:20px" onclick="showPage('invite-page')">Sair</button>
    </div>

    <script>
        // --- COLOQUE O SEU NOVO URL DO GOOGLE APPS SCRIPT AQUI ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUGzBGgllatmtGQMM7VwtR6XBYCm6I8BnKstzqTjiUvHbUF-_ZkEeI8jcqGCWb7QFQcw/exec";

        async function saveGuest(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerText = "Enviando...";

            const guestData = {
                nome: document.getElementById('name').value,
                status: document.querySelector('input[name="presence"]:checked').value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(guestData)
                });
                
                if (guestData.status === 'Sim, eu vou!') {
                    Swal.fire({
                        title: 'Que alegria!',
                        html: `<p>Resposta registrada!</p><p>Local da festa:</p><a href="https://maps.app.goo.gl/3U17oVefoodYHvru6?g_st=aw" target="_blank" style="color:#ff7f7f;font-weight:bold;">Ver no Google Maps</a>`,
                        icon: 'success', confirmButtonColor: '#ff7f7f'
                    });
                } else {
                    Swal.fire({ title: 'Resposta confirmada', icon: 'info', confirmButtonColor: '#ff7f7f' });
                }

                document.getElementById('rsvp-form').reset();
            } catch (e) {
                Swal.fire({ title: 'Erro', text: 'Não foi possível salvar.', icon: 'error' });
            } finally {
                btn.disabled = false;
                btn.innerText = "Confirmar Presença";
            }
        }

        async function loadGuests() {
            const tbody = document.querySelector('#guests-table tbody');
            tbody.innerHTML = '<tr><td colspan="3">Carregando planilha...</td></tr>';
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                tbody.innerHTML = '';
                
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhum convidado ainda.</td></tr>';
                } else {
                    data.forEach(g => {
                        let corStatus = g.status === 'Sim, eu vou!' ? 'color: green; font-weight: bold;' : 'color: red; font-weight: bold;';
                        tbody.innerHTML += `<tr>
                            <td>${g.nome}</td>
                            <td style="${corStatus}">${g.status}</td>
                            <td><button class="btn-delete" onclick="deleteGuest('${g.nome}')">Excluir</button></td>
                        </tr>`;
                    });
                }
            } catch (e) { alert("Erro ao ler planilha"); }
        }

        // Função para deletar convidados
        async function deleteGuest(nomeConvidado) {
            Swal.fire({
                title: 'Tem certeza?',
                text: `Você quer apagar ${nomeConvidado} da lista?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff4d4d',
                cancelButtonColor: '#aaa',
                confirmButtonText: 'Sim, apagar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    // Pop-up de carregamento
                    Swal.fire({title: 'Apagando...', allowOutsideClick: false, didOpen: () => {Swal.showLoading()}});
                    
                    try {
                        // Envia o pedido para o script com a ação "delete"
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: "delete", nome: nomeConvidado })
                        });
                        
                        Swal.fire({ title: 'Apagado!', text: 'O convidado foi removido.', icon: 'success', confirmButtonColor: '#ff7f7f' });
                        loadGuests(); // Recarrega a tabela automaticamente
                    } catch(e) {
                        Swal.fire('Erro', 'Não foi possível apagar.', 'error');
                    }
                }
            });
        }

        function showPage(pageId) {
            document.querySelectorAll('.container').forEach(c => c.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
        }

        function checkPassword() {
            if (document.getElementById('password').value === 'manurafa') {
                showPage('admin-page');
                loadGuests();
            } else {
                Swal.fire({ title: 'Erro!', text: 'Senha incorreta!', icon: 'error', confirmButtonColor: '#ff7f7f' });
            }
        }
    </script>
</body>
</html>
